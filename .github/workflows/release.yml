name: Release

# Pushing a tag like v1.21.0 builds both platforms and attaches the files to a
# draft release. Nothing reaches installed copies until the draft is published.
on:
  push:
    tags: ['v*']

concurrency:
  group: release-${{ github.ref }}

permissions:
  contents: write

jobs:
  draft:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - name: Check the tag matches package.json
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$TAG" ]; then
            echo "Tag $TAG does not match package.json version $version" >&2
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: Create the draft release
        run: |
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            gh release create "$TAG" --draft --verify-tag --title "Interleaf ${TAG#v}" --notes ""
          elif [ "$(gh release view "$TAG" --json isDraft -q .isDraft)" != "true" ]; then
            # Installed copies may already have these files; never swap them.
            echo "$TAG is already published" >&2
            exit 1
          fi

  build:
    needs: draft
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: build:win
            files: dist/*-setup.exe dist/*-setup.exe.blockmap dist/latest.yml
          - os: ubuntu-latest
            script: build:linux
            files: dist/*.AppImage dist/*.deb dist/latest-linux.yml
    runs-on: ${{ matrix.os }}
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run ${{ matrix.script }}
      - name: Attach the files to the draft
        shell: bash
        run: gh release upload "$TAG" ${{ matrix.files }} --clobber
