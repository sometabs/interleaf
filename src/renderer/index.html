<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Interleaf</title>
    <!-- `base-uri` and `form-action` are listed because neither falls back to
      `default-src`. The websocket allowance is Vite's hot reload. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: bookcover:; font-src 'self'; connect-src 'self' ws://localhost:* ws://127.0.0.1:*; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'"
    />
  </head>

  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
